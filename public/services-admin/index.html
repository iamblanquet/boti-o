<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor de Servicios Thessa</title>
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 m-0 p-0 antialiased h-screen flex flex-col overflow-hidden">
  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <header id="appNavbar" class="catalog-topbar flex flex-col sm:flex-row gap-y-3 items-center justify-between px-4 sm:px-6 py-3 bg-gradient-to-r from-emerald-800 to-emerald-600 text-white shadow-md z-10 shrink-0">
      
      <div class="flex items-center justify-between w-full sm:w-auto">
        <div class="flex items-center gap-4">
          <button id="mainMenuBtn" class="flex flex-col gap-1.5 p-2 rounded-lg hover:bg-white/10 transition cursor-pointer group" type="button" aria-label="Menu">
            <span class="w-5 h-[2px] bg-white rounded-full group-hover:bg-emerald-100 transition"></span>
            <span class="w-5 h-[2px] bg-white rounded-full group-hover:bg-emerald-100 transition"></span>
            <span class="w-5 h-[2px] bg-white rounded-full group-hover:bg-emerald-100 transition"></span>
          </button>
          <a class="brand flex items-center transition shrink-0 hover:opacity-80" href="/services-admin/" aria-label="Thessa servicios">
            <img src="/mediaFiles/Logo_Thessa.png" alt="Thessa Admin" class="h-11 w-auto object-contain">
          </a>
        </div>
        
        <!-- Dropdown Móvil -->
        <div class="relative sm:hidden group">
          <button class="w-10 h-10 flex items-center justify-center bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg shadow-sm focus:outline-none transition" aria-label="Añadir">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          </button>
          <div class="absolute right-0 top-full mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden z-50 opacity-0 invisible group-focus-within:opacity-100 group-focus-within:visible transition-all origin-top-right">
            <button onmousedown="document.getElementById('newServiceButton').click()" class="w-full text-left px-4 py-3 text-sm text-slate-700 hover:bg-slate-50 font-medium border-b border-slate-100 transition block">Nuevo servicio</button>
            <button onmousedown="document.getElementById('newCategoryButton').click()" class="w-full text-left px-4 py-3 text-sm text-slate-700 hover:bg-slate-50 font-medium transition block">Nueva categoría</button>
          </div>
        </div>
      </div>
      
      <div class="search-box w-full sm:flex-1 sm:w-auto sm:max-w-xl relative sm:mx-4">
        <svg class="w-5 h-5 absolute left-3 top-2.5 text-emerald-100/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input id="searchInput" type="search" placeholder="Buscar servicios o categorías..." class="w-full pl-10 pr-4 py-2 bg-black/10 border border-transparent rounded-xl text-sm text-white placeholder-emerald-100/70 focus:bg-black/20 focus:border-white/20 focus:ring-2 focus:ring-white/20 transition outline-none">
      </div>
      
      <div class="topbar-actions hidden sm:flex items-center gap-2 sm:gap-3 shrink-0">
        <!-- Botones de Escritorio -->
        <button id="newCategoryButton" class="px-4 py-2 bg-black/10 border border-transparent text-emerald-50 rounded-lg text-sm font-semibold hover:bg-black/20 hover:text-white transition shadow-sm" type="button">Nueva categoría</button>
        <button id="newServiceButton" class="px-4 py-2 bg-emerald-700 border border-transparent text-white rounded-lg text-sm font-semibold hover:bg-emerald-800 transition shadow-sm flex items-center gap-2" type="button">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>Nuevo servicio</span>
        </button>
      </div>
    </header>

    <!-- Canvas Stage -->
    <section class="canvas-stage flex-1 relative overflow-hidden bg-slate-100/50">
      <canvas id="catalogCanvas" class="w-full h-full block touch-none"></canvas>
      
      <!-- Reusable Toast Notification -->
      <toast-notification></toast-notification>
    </section>
  </main>

  <!-- Confirm Overlay -->
  <div id="confirmOverlay" class="confirm-overlay fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center" aria-hidden="true">
    <canvas id="confirmCanvas" class="max-w-md w-full bg-white rounded-2xl shadow-2xl"></canvas>
  </div>

  <!-- Service Editor Drawer -->
  <aside id="editorDrawer" class="drawer fixed inset-y-0 right-0 w-full max-w-md bg-white shadow-2xl z-40 flex flex-col border-l border-slate-200" aria-hidden="true">
    <form id="serviceForm" class="flex-1 flex flex-col h-full overflow-hidden">
      
      <div class="px-6 py-5 border-b border-slate-100 flex items-start justify-between bg-slate-50 shrink-0">
        <div>
          <h1 id="serviceFormTitle" class="text-xl font-bold text-slate-800">Servicio</h1>
          <p id="serviceFormSubtitle" class="text-sm text-slate-500 mt-1">Edita la información que usará el bot.</p>
        </div>
        <button class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-200/50 rounded-lg transition" type="button" data-close-drawer aria-label="Cerrar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
        
        <label class="flex flex-col gap-2 text-sm font-semibold text-slate-700">
          Nombre
          <input id="nameInput" type="text" required class="px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition font-normal">
        </label>

        <label class="flex flex-col gap-2 text-sm font-semibold text-slate-700">
          Categoría
          <select id="categoryInput" required class="px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition font-normal"></select>
        </label>

        <div class="grid grid-cols-2 gap-4">
          <label class="flex flex-col gap-2 text-sm font-semibold text-slate-700">
            Duración (Minutos)
            <input id="durationInput" type="number" min="0" step="5" placeholder="Ej. 30" class="px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition font-normal">
          </label>
        </div>

        <section class="price-editor border-t border-slate-100 pt-6">
          <div class="flex items-start justify-between gap-4 mb-4">
            <div>
              <strong class="block text-sm font-semibold text-slate-800">Precios por personas</strong>
              <span class="block text-xs text-slate-500 mt-1">Agrega precios específicos para 1, 2, 3 o más personas.</span>
            </div>
            <button id="addPriceButton" class="shrink-0 px-3 py-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200 font-medium text-xs rounded-lg transition" type="button">Agregar precio</button>
          </div>
          <div id="priceRows" class="flex flex-col gap-3"></div>
        </section>

        <section class="image-editor border-t border-slate-100 pt-6">
          <div class="mb-4">
            <strong class="block text-sm font-semibold text-slate-800">Imagen del servicio</strong>
            <span class="block text-xs text-slate-500 mt-1">Se enviará cuando el bot responda por este servicio.</span>
          </div>
          <div class="image-picker bg-slate-50 border border-slate-200 border-dashed rounded-xl p-4 flex flex-col items-center justify-center gap-4 text-center relative overflow-hidden group">
            <img id="serviceImagePreview" alt="" hidden class="max-h-40 w-auto rounded-lg shadow-sm object-cover">
            <div class="image-picker-actions flex flex-col items-center gap-2">
              <input id="serviceImageValue" type="hidden">
              <label class="cursor-pointer px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50 transition shadow-sm">
                Seleccionar imagen
                <input id="serviceImageInput" type="file" accept="image/png,image/jpeg,image/webp" class="hidden">
              </label>
              <button id="removeServiceImageButton" class="text-xs text-red-600 hover:text-red-700 font-medium" type="button">Quitar imagen</button>
            </div>
          </div>
        </section>

        <label class="flex flex-col gap-2 text-sm font-semibold text-slate-700">
          Descripción
          <textarea id="descriptionInput" rows="4" class="px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition font-normal resize-none"></textarea>
        </label>

        <label class="flex flex-col gap-2 text-sm font-semibold text-slate-700 mb-6">
          Beneficios
          <textarea id="benefitsInput" rows="4" placeholder="Un beneficio por línea..." class="px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition font-normal resize-none"></textarea>
        </label>

        <label class="flex flex-col gap-2 text-sm font-semibold text-slate-700 mb-6">
          Cuidados posteriores
          <span class="text-xs font-normal text-slate-500">Se envían al terminar una cita confirmada. Puedes usar {{name}}, {{service}} y {{datetime}}.</span>
          <textarea id="postCareMessageInput" rows="5" placeholder="Ej. Después de tu {{service}}, toma agua y descansa si lo necesitas." class="px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition font-normal resize-none"></textarea>
        </label>

      </div>

      <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 shrink-0 flex items-center justify-between gap-3">
        <button id="deleteServiceButton" class="px-4 py-2 text-red-600 hover:bg-red-50 font-medium text-sm rounded-lg transition" type="button">Eliminar</button>
        <div class="flex items-center gap-3 ml-auto">
          <button class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm font-semibold hover:bg-slate-50 transition shadow-sm" type="button" data-close-drawer>Cancelar</button>
          <button id="saveServiceButton" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-semibold hover:bg-emerald-700 transition shadow-sm" type="submit">Guardar</button>
        </div>
      </div>
    </form>
  </aside>

  <!-- Category Editor Drawer -->
  <aside id="categoryDrawer" class="drawer fixed inset-y-0 right-0 w-full max-w-sm bg-white shadow-2xl z-40 flex flex-col border-l border-slate-200" aria-hidden="true">
    <form id="categoryForm" class="flex-1 flex flex-col h-full overflow-hidden">
      
      <div class="px-6 py-5 border-b border-slate-100 flex items-start justify-between bg-slate-50 shrink-0">
        <div>
          <h1 id="categoryFormTitle" class="text-xl font-bold text-slate-800">Categoría</h1>
          <p id="categoryFormSubtitle" class="text-sm text-slate-500 mt-1">Organiza los servicios del catálogo.</p>
        </div>
        <button class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-200/50 rounded-lg transition" type="button" data-close-category aria-label="Cerrar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
        <label class="flex flex-col gap-2 text-sm font-semibold text-slate-700">
          Nombre de categoría
          <input id="categoryNameInput" type="text" required class="px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition font-normal">
        </label>
      </div>

      <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 shrink-0 flex items-center justify-between gap-3">
        <button id="deleteCategoryButton" class="px-4 py-2 text-red-600 hover:bg-red-50 font-medium text-sm rounded-lg transition" type="button">Eliminar</button>
        <div class="flex items-center gap-3 ml-auto">
          <button class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm font-semibold hover:bg-slate-50 transition shadow-sm" type="button" data-close-category>Cancelar</button>
          <button id="saveCategoryButton" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-semibold hover:bg-emerald-700 transition shadow-sm" type="submit">Guardar</button>
        </div>
      </div>
    </form>
  </aside>

  <!-- Reusable Side Drawer -->
  <side-drawer active="services-admin"></side-drawer>

  <!-- Component scripts -->
  <script src="/components/SideDrawer.js"></script>
  <script src="/components/ToastNotification.js"></script>

  <script src="/services-admin/app.js?v=20260618-price-save"></script>
</body>
</html>
