<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seguimiento de pacientes - Thessa</title>
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="h-screen overflow-hidden bg-slate-50 text-slate-800 antialiased">
  <div class="flex h-full flex-col">
    <header class="z-50 flex shrink-0 items-center justify-between bg-gradient-to-r from-emerald-800 to-emerald-600 px-4 py-3 text-white shadow-md sm:px-6">
      <div class="flex items-center gap-4">
        <button id="mainMenuBtn" class="group flex cursor-pointer flex-col gap-1.5 rounded-lg p-2 transition hover:bg-white/10" type="button" aria-label="Menu">
          <span class="h-0.5 w-5 rounded-full bg-white"></span>
          <span class="h-0.5 w-5 rounded-full bg-white"></span>
          <span class="h-0.5 w-5 rounded-full bg-white"></span>
        </button>
        <a href="/home" class="brand flex shrink-0 items-center transition hover:opacity-80">
          <img src="/mediaFiles/Logo_Thessa.png" alt="Thessa" class="h-11 w-auto object-contain">
        </a>
      </div>
      <div class="flex items-center gap-2">
        <a href="/dashboard" class="hidden items-center gap-2 rounded-xl bg-white/10 px-3 py-2 text-sm font-bold text-white transition hover:bg-white/20 sm:inline-flex">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          Bandeja
        </a>
        <button id="refreshBoard" type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-white/10 text-white transition hover:bg-white/20" aria-label="Actualizar tablero">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
      </div>
    </header>

    <main class="flex min-h-0 flex-1 flex-col gap-4 p-3 sm:p-4 lg:p-6">
      <section class="tracking-header shrink-0">
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Seguimiento de pacientes</h1>
          <p class="mt-1 max-w-3xl text-sm text-slate-500">Proceso de captación y seguimiento por etapas, sin modificar chats ni citas existentes.</p>
        </div>
        <div class="tracking-toolbar">
          <label class="tracking-control tracking-search-control">
            <svg class="h-4 w-4 shrink-0 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input id="searchPatients" type="search" placeholder="Buscar paciente, teléfono o mensaje..." autocomplete="off">
          </label>
          <select id="responsibleFilter" class="tracking-control tracking-select">
            <option value="all">Todos los responsables</option>
          </select>
          <select id="sourceFilter" class="tracking-control tracking-select tracking-source-select">
            <option value="all">Manual y auto</option>
            <option value="automatic">Automático</option>
            <option value="manual">Manual</option>
          </select>
          <div class="tracking-count tracking-control">
            <span id="totalPatients">0</span>
            <span>en vista</span>
          </div>
        </div>
      </section>

      <section class="board-shell min-h-0 flex-1 overflow-hidden">
        <section id="trackingBoard" class="tracking-board flex min-h-0 h-full gap-4 overflow-x-auto overflow-y-hidden"></section>
      </section>
    </main>
  </div>

  <side-drawer active="patient-tracking"></side-drawer>
  <alert-modal></alert-modal>

  <!-- Modal para Visualizar Chat de Bandeja (Embedded) -->
  <div id="chatModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4">
    <div>
      <!-- Modal Header -->
      <header class="chat-modal-header shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
          <h3 class="text-sm font-bold text-slate-700">Atención de Paciente</h3>
        </div>
        <button id="closeChatModal" type="button" class="text-slate-400 hover:text-slate-600 transition p-1.5 rounded-lg hover:bg-slate-200/50 cursor-pointer" aria-label="Cerrar modal">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </header>
      <!-- Modal Body (Iframe) -->
      <div class="chat-modal-body">
        <iframe id="chatIframe" class="chat-modal-iframe" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script src="/components/SideDrawer.js"></script>
  <script src="/components/AlertModal.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
